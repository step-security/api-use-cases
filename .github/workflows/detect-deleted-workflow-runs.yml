name: Detect Deleted Workflow Runs

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'GitHub organization/owner name'
        required: true
        type: string
      repo:
        description: 'Repository name'
        required: true
        type: string
      start_time:
        description: 'Window start: Unix epoch seconds or YYYY-MM-DD (default: 90 days ago, the API limit)'
        required: false
        type: string
      end_time:
        description: 'Window end: Unix epoch seconds or YYYY-MM-DD (default: now)'
        required: false
        type: string
      min_run_id:
        description: 'Only keep runs with id >= this value (optional)'
        required: false
        type: string
      max_run_id:
        description: 'Only keep runs with id <= this value (optional)'
        required: false
        type: string
      skip_github_check:
        description: 'Only snapshot StepSecurity metadata, skip the GitHub diff'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  detect-deleted-runs:
    permissions:
      contents: read  # for actions/checkout to fetch code
      actions: read   # lets the fallback GITHUB_TOKEN read workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Make script executable
        run: chmod +x scripts/detect_deleted_workflow_runs.sh

      - name: Detect deleted workflow runs
        env:
          # StepSecurity API token.
          API_KEY: ${{ secrets.API_KEY }}
          # Preferred: a token with `actions: read` on the TARGET repo. The
          # default GITHUB_TOKEN is scoped to this repository, so a private
          # target repo needs a PAT here (fine-grained with Actions:Read, or
          # classic with `repo`).
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          # Fallback so a public target repo works with no extra setup. Still far
          # better than anonymous: 5,000 API requests/hour instead of 60.
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${API_KEY:-}" ]; then
            echo "::error::Secret API_KEY is not set."
            exit 1
          fi

          ARGS=(
            --owner "${{ inputs.owner }}"
            --repo  "${{ inputs.repo }}"
            --token "$API_KEY"
          )

          if [ "${{ inputs.skip_github_check }}" = "true" ]; then
            ARGS+=(--skip-github-check)
          elif [ -n "${GH_READ_TOKEN:-}" ]; then
            echo "Using GH_READ_TOKEN for the GitHub existence check."
            ARGS+=(--github-token "$GH_READ_TOKEN")
          else
            # No dedicated token. Try the workflow's own GITHUB_TOKEN, which is
            # enough to read a public repo's runs and carries the full
            # authenticated rate limit. The script preflights access and exits
            # with a clear error if it is not sufficient, so this can never
            # silently misreport runs as deleted.
            echo "::notice::GH_READ_TOKEN not set; falling back to GITHUB_TOKEN."
            echo "::notice::Set GH_READ_TOKEN if ${{ inputs.owner }}/${{ inputs.repo }} is private."
            ARGS+=(--github-token "$DEFAULT_TOKEN")
          fi

          [ -n "${{ inputs.start_time }}" ] && ARGS+=(--start-time "${{ inputs.start_time }}")
          [ -n "${{ inputs.end_time }}"   ] && ARGS+=(--end-time   "${{ inputs.end_time }}")
          [ -n "${{ inputs.min_run_id }}" ] && ARGS+=(--min-run-id "${{ inputs.min_run_id }}")
          [ -n "${{ inputs.max_run_id }}" ] && ARGS+=(--max-run-id "${{ inputs.max_run_id }}")

          ./scripts/detect_deleted_workflow_runs.sh "${ARGS[@]}"

      - name: Summarize findings
        if: always()
        run: |
          if [ ! -f deleted-run-analysis/summary.json ]; then
            echo "No summary produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CHECKED=$(jq -r '.github_checked // false' deleted-run-analysis/summary.json)
          RUNS=$(jq -r '.stepsecurity_runs // 0' deleted-run-analysis/summary.json)

          {
            echo "## Deleted workflow run analysis"
            echo ""
            if [ "$CHECKED" != "true" ]; then
              # Without this the reader sees deleted_from_github: 0 and concludes
              # "nothing was deleted", when in fact nothing was looked at.
              echo "> **The GitHub diff did not run.** $RUNS run(s) were snapshotted from"
              echo "> StepSecurity, but none were checked against GitHub, so this says"
              echo "> nothing about whether any run was deleted."
              echo ""
            fi
            echo '```json'
            cat deleted-run-analysis/summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          DELETED=$(jq -r '.deleted_from_github // 0' deleted-run-analysis/summary.json)
          if [ "$CHECKED" = "true" ] && [ "$DELETED" -gt 0 ] 2>/dev/null; then
            {
              echo ""
              echo "### :rotating_light: $DELETED run(s) deleted from GitHub"
              echo ""
              echo "| run_id | workflow | branch | actor | started |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.run_id) | \(.workflow_path // "?") | \(.head_branch // "?") | \(.actor // "?") | \(.started_at // "?") |"' \
                deleted-run-analysis/deleted-runs.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deleted-run-analysis-${{ inputs.owner }}-${{ inputs.repo }}
          path: deleted-run-analysis/
          retention-days: 30
