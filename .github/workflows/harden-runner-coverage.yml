name: Harden Runner Coverage Report

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Tenant name (used when org is empty to report across all orgs)'
        required: false
        type: string
      org:
        description: 'GitHub organization name (leave empty to report across all orgs in the tenant)'
        required: false
        type: string
      start_date:
        description: 'Start date (YYYY-MM-DD). Leave empty to default to 7 days before the end date.'
        required: false
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD). Leave empty to default to today (UTC).'
        required: false
        type: string

permissions: {}

jobs:
  coverage-report:
    permissions:
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Make script executable
        run: chmod +x scripts/harden_runner_coverage.sh

      - name: Validate inputs
        run: |
          if [[ -z "${{ inputs.tenant }}" && -z "${{ inputs.org }}" ]]; then
            echo "Error: at least one of 'tenant' or 'org' must be provided." >&2
            exit 1
          fi

      - name: Generate coverage report
        run: |
          ARGS="--token ${{ secrets.API_KEY }} --output-prefix harden_runner_coverage"
          if [[ -n "${{ inputs.tenant }}" ]]; then
            ARGS="$ARGS --tenant ${{ inputs.tenant }}"
          fi
          if [[ -n "${{ inputs.org }}" ]]; then
            ARGS="$ARGS --org ${{ inputs.org }}"
          fi
          if [[ -n "${{ inputs.start_date }}" ]]; then
            ARGS="$ARGS --start-date ${{ inputs.start_date }}"
          fi
          if [[ -n "${{ inputs.end_date }}" ]]; then
            ARGS="$ARGS --end-date ${{ inputs.end_date }}"
          fi
          ./scripts/harden_runner_coverage.sh $ARGS

      - name: Upload results as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harden-runner-coverage-report
          path: |
            harden_runner_coverage_daily.csv
            harden_runner_coverage_workflows.csv
          retention-days: 30
